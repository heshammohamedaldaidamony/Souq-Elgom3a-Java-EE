<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <!-- Background -->
    <rect width="400" height="400" fill="#F3EDE2"/>

    <!-- Box icon (centered) -->
    <g transform="translate(200, 185)">
        <!-- Box body -->
        <path d="M-70,-35 L0,-70 L70,-35 L70,35 L0,70 L-70,35 Z"
              fill="none" stroke="#8B5E3C" stroke-width="5"
              stroke-linejoin="round"/>
        <!-- Top fold -->
        <path d="M-70,-35 L0,0 L70,-35"
              fill="none" stroke="#B8895C" stroke-width="4"
              stroke-linejoin="round"/>
        <!-- Center seam -->
        <path d="M0,0 L0,70"
              fill="none" stroke="#B8895C" stroke-width="4"/>
    </g>

    <!-- Label -->
    <text x="200" y="330"
          font-family="Arial, sans-serif" font-size="20" font-weight="bold"
          fill="#7A7267" text-anchor="middle">
        No Image
    </text>
</svg>